<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixelWorks - Project Cost Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="nav-container">
            <a href="index.html" class="logo">PixelWorks</a>
            <div class="hamburger" id="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
            <ul class="nav-links" id="navLinks">
                <li><a href="index.html">Home</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="calculator.html" class="active" style="color: #60a5fa;">Cost Calculator</a></li>
                <li><a href="reviews.html">Reviews</a></li>
                <li><a href="chat.html">Live Chat</a></li>
                <li><a href="contact.html">Inquire Now</a></li>
            </ul>
        </div>
    </header>

    <section class="section" style="padding-top: 140px; max-width: 700px;">
        <h2 class="section-title" style="margin-bottom: 10px;">Website Cost Estimator</h2>
        <p style="text-align: center; color: var(--text-muted); margin-bottom: 40px;">Apni zaroorat ke hisaab se options select karein aur turant estimated price dekhein.</p>
        
        <div class="card" style="padding: 30px; display: flex; flex-direction: column; gap: 25px;">
            <div>
                <label style="display: block; font-size: 14px; margin-bottom: 8px; color: var(--text-muted);">Website Type / Pages</label>
                <select id="calcType" style="width: 100%; padding: 14px; background: #090d16; border: 1px solid var(--border-color); border-radius: 8px; color: #fff; font-size: 15px;">
                    <option value="2999">Landing Page / Single Page (₹2,999)</option>
                    <option value="5999" selected>Business 5-Page Website (₹5,999)</option>
                    <option value="12999">E-Commerce / Online Store (₹12,999)</option>
                </select>
            </div>

            <div>
                <label style="display: block; font-size: 14px; margin-bottom: 8px; color: var(--text-muted);">Extra Add-ons</label>
                <div style="display: flex; flex-direction: column; gap: 10px;">
                    <label style="display: flex; align-items: center; gap: 10px; cursor: pointer; color: #fff; font-size: 14px;">
                        <input type="checkbox" id="addonSEO" value="1500" style="width: 18px; height: 18px;"> Advanced SEO Optimization (+₹1,500)
                    </label>
                    <label style="display: flex; align-items: center; gap: 10px; cursor: pointer; color: #fff; font-size: 14px;">
                        <input type="checkbox" id="addonSpeed" value="1000" style="width: 18px; height: 18px;"> High-Speed Optimization (+₹1,000)
                    </label>
                </div>
            </div>

            <div style="background: #090d16; padding: 20px; border-radius: 8px; border: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center;">
                <span style="font-size: 16px; color: var(--text-muted);">Estimated Total Price:</span>
                <span id="totalPrice" style="font-size: 24px; font-weight: 700; color: #34d399;">₹5,999</span>
            </div>

            <button id="bookPlanBtn" class="btn-primary" style="text-align: center; border: none;">Book This Plan Now</button>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 PixelWorks Agency. Designed & Developed by Aditya<img src="verified.png" alt="Verified" class="verified-img" style="width: 16px; height: 16px;"></p>
    </footer>

    <!-- 1. Firebase SDK - PEHLE -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <!-- 2. TERA GLOBAL JS - DUSRA -->
    <script src="script.js"></script>

    <!-- 3. PAGE KA CODE - TEESRA -->
    <script>
        // Firebase Init - YE MISSING THA
        const firebaseConfig = {
            apiKey: "AIzaSyBPFYE7EUeDJHpTKvBjY6ybHTj-85OYZFY",
            authDomain: "pixelworks-agency.firebaseapp.com",
            databaseURL: "https://pixelworks-agency-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "pixelworks-agency",
            storageBucket: "pixelworks-agency.firebasestorage.app",
            messagingSenderId: "265457916349",
            appId: "1:265457916349:web:1f2f903ed3eaf858c51ad4",
            measurementId: "G-21TVP274BD"
        };
        firebase.initializeApp(firebaseConfig);
        const rtdb = firebase.database();

        const calcType = document.getElementById('calcType');
        const addonSEO = document.getElementById('addonSEO');
        const addonSpeed = document.getElementById('addonSpeed');
        const totalPrice = document.getElementById('totalPrice');
        const bookPlanBtn = document.getElementById('bookPlanBtn');

        function calculateCost() {
            let base = parseInt(calcType.value);
            let addons = [];
            if(addonSEO.checked) { base += parseInt(addonSEO.value); addons.push("SEO"); }
            if(addonSpeed.checked) { base += parseInt(addonSpeed.value); addons.push("Speed"); }
            totalPrice.textContent = '₹' + base.toLocaleString('en-IN');
            let planName = calcType.options[calcType.selectedIndex].text;
            bookPlanBtn.onclick = () => {
                rtdb.ref('calculator_clicks').push({ plan: planName, addons: addons, price: base, time: Date.now() });
                window.location.href = `contact.html?plan=${encodeURIComponent(planName)}&price=${base}`;
            }
        }
        calcType.addEventListener('change', calculateCost);
        addonSEO.addEventListener('change', calculateCost);
        addonSpeed.addEventListener('change', calculateCost);
        calculateCost();
    </script>
</body>
</html>
