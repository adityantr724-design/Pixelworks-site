<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixelWorks - Live Chat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="nav-container">
            <a href="index.html" class="logo">PixelWorks</a>
            <div class="hamburger" id="hamburger"> <!-- YE ADD KIYA -->
                <span></span>
                <span></span>
                <span></span>
            </div>
            <ul class="nav-links" id="navLinks"> <!-- id add kiya -->
                <li><a href="index.html">Home</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="reviews.html">Reviews</a></li>
                <li><a href="chat.html" class="active">Live Chat</a></li>
                <li><a href="contact.html" style="color: #60a5fa;">Inquire Now</a></li>
            </ul>
        </div>
    </header>

    <section class="section" style="padding-top: 120px; max-width: 600px;">
        <h2 class="section-title" style="margin-bottom: 10px;">Live Support Chat</h2>
        <p id="welcomeUserText" style="text-align: center; color: #34d399; margin-bottom: 20px; font-weight: 600;"></p>
        
        <!-- Chat Box Container -->
        <div class="card" style="padding: 20px; display: flex; flex-direction: column; height: 450px;">
            <div id="chatMessages" style="flex: 1; background: #090d16; border: 1px solid var(--border-color); border-radius: 8px; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px;">
                <!-- Messages will load here -->
            </div>

            <div style="display: flex; gap: 10px;">
                <input type="text" id="chatInput" placeholder="Yahan message likhein..." style="flex: 1; padding: 12px; background: #090d16; border: 1px solid var(--border-color); border-radius: 8px; color: #fff; font-size: 14px;">
                <button id="sendChatBtn" class="btn-primary" style="padding: 0 20px; border-radius: 8px; border: none; cursor: pointer;">Send</button>
            </div>
        </div>
    </section>

    <!-- 1. Firebase SDK - PEHLE -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <!-- 2. TERA GLOBAL JS - DUSRA -->
    <script src="script.js"></script>

    <!-- 3. PAGE KA FIREBASE + CHAT CODE - TEESRA -->
    <script>
        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyBPFYE7EUeDJHpTKvBjY6ybHTj-85OYZFY",
            authDomain: "pixelworks-agency.firebaseapp.com",
            databaseURL: "https://pixelworks-agency-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "pixelworks-agency",
            storageBucket: "pixelworks-agency.firebasestorage.app",
            messagingSenderId: "265457916349",
            appId: "1:265457916349:web:1f2f903ed3eaf858c51ad4",
            measurementId: "G-21TVP274BD"
        };
        firebase.initializeApp(firebaseConfig);
        const rtdb = firebase.database();

        // Check Login
        let currentUser = JSON.parse(localStorage.getItem('pixelworks_logged_user'));

        if (!currentUser) {
            alert('Chat shuru karne ke liye pehle login karein!');
            window.location.href = 'login.html';
        } else {
            document.getElementById('welcomeUserText').textContent = `Connected as: ${currentUser.name} (${currentUser.phone})`;
        }

        const chatMessages = document.getElementById('chatMessages');
        const chatInput = document.getElementById('chatInput');
        const sendChatBtn = document.getElementById('sendChatBtn');

        // Har user ke liye alag chat node
        let chatRef = rtdb.ref('chats/' + currentUser.phone + '/messages');

        // Real-time listener messages load karne ke liye
        chatRef.on('value', (snapshot) => {
            chatMessages.innerHTML = '';
            if (!snapshot.exists()) {
                chatMessages.innerHTML = '<p style="color: var(--text-muted); text-align: center; font-size: 13px; margin-top: auto; margin-bottom: auto;">Aditya se seedha baat karein. Message bhejiye!</p>';
                return;
            }

            let messagesObj = snapshot.val();
            Object.values(messagesObj).forEach(msg => {
                let div = document.createElement('div');
                div.style.padding = '10px 14px';
                div.style.borderRadius = '8px';
                div.style.maxWidth = '75%';
                div.style.fontSize = '14px';
                
                if(msg.sender === 'client') {
                    div.style.background = '#1e3a8a';
                    div.style.color = '#fff';
                    div.style.alignSelf = 'flex-end';
                } else {
                    div.style.background = '#1f2937';
                    div.style.color = '#e5e7eb';
                    div.style.alignSelf = 'flex-start';
                }
                div.textContent = msg.text;
                chatMessages.appendChild(div);
            });
            chatMessages.scrollTop = chatMessages.scrollHeight;
        });

        // Message Bhejna
        sendChatBtn.addEventListener('click', () => {
            let text = chatInput.value.trim();
            if(!text) return;

            chatRef.push({
                sender: 'client',
                text: text,
                time: Date.now()
            });

            // Beep + Notification
            if(typeof playNotificationSound === 'function') playNotificationSound();
            
            chatInput.value = '';
        });

        chatInput.addEventListener('keypress', (e) => {
            if(e.key === 'Enter') sendChatBtn.click();
        });
    </script>
</body>
</html>
