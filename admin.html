<!DOCTYPE html>
<html lang="hi" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixelWorks - Admin Dashboard</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #090d16;
            color: #fff;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
      .page-wrapper {
            max-width: 1100px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
      .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 10px;
            margin-bottom: 20px;
        }
      .login-box {
            max-width: 400px;
            margin: 80px auto;
            padding: 30px;
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 12px;
            text-align: center;
        }
      .dashboard-grid {
            display: none;
            flex: 1;
            gap: 20px;
            height: calc(100vh - 130px);
        }
      .sidebar {
            width: 300px;
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 10px;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
      .chat-area {
            flex: 1;
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 10px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
      .client-item {
            padding: 12px;
            background: #090d16;
            border: 1px solid #374151;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }
      .client-item:hover { border-color: #3b82f6; }
      .client-item.active { border-color: #3b82f6; background: #1f2937; }
      .messages-box {
            flex: 1;
            overflow-y: auto;
            padding: 15px 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
      .input-field {
            width: 100%;
            padding: 12px;
            background: #090d16;
            border: 1px solid #374151;
            border-radius: 8px;
            color: #fff;
            margin-bottom: 12px;
        }
      .btn-main {
            width: 100%;
            padding: 12px;
            background: #3b82f6;
            border: none;
            border-radius: 8px;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
        }
      .msg-bubble {
            padding: 10px 14px;
            border-radius: 10px;
            max-width: 75%;
            font-size: 13px;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

    <div class="page-wrapper">
        <div class="header">
            <h2 style="margin: 0; font-size: 20px; color: #60a5fa;">PixelWorks Admin Portal</h2>
            <button id="logoutBtn" onclick="logoutAdmin()" style="display: none; background: #ef4444; border: none; color: #fff; padding: 8px 14px; border-radius: 6px; cursor: pointer;">Logout</button>
        </div>

        <!-- Login Section -->
        <div id="loginSection" class="login-box">
            <h3 style="margin-top: 0; margin-bottom: 20px;">Founder Login</h3>
            <form onsubmit="handleLogin(event)">
                <input type="password" id="passInput" class="input-field" required placeholder="Enter Password">
                <button type="submit" class="btn-main">Login</button>
            </form>
            <p id="errorMsg" style="color: #ef4444; font-size: 13px; margin-top: 10px; display: none;">Galat password hai!</p>
        </div>

        <!-- Dashboard Section -->
        <div id="dashboardSection" class="dashboard-grid">
            <div class="sidebar">
                <h4 style="margin: 0 0 10px 0; border-bottom: 1px solid #374151; padding-bottom: 10px; font-size: 15px;">Clients List</h4>
                <div id="sidebarClients" style="display: flex; flex-direction: column; gap: 8px;"></div>
            </div>

            <div class="chat-area">
                <div id="chatHeaderTitle" style="border-bottom: 1px solid #374151; padding-bottom: 10px; font-weight: 600; font-size: 15px;">
                    Koi client select karein
                </div>

                <div id="messagesContainer" class="messages-box">
                    <p style="color: #9ca3af; text-align: center; margin-top: 120px;">Left menu se client ka naam chunein.</p>
                </div>

                <div style="display: flex; gap: 10px; border-top: 1px solid #374151; padding-top: 12px;">
                    <input type="text" id="replyInput" class="input-field" style="margin-bottom: 0;" placeholder="Yahan reply type karein..." disabled>
                    <button id="sendReplyBtn" onclick="sendReply()" class="btn-main" style="width: auto; padding: 0 20px;" disabled>Send</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 1. Firebase SDK - PEHLE -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <!-- 2. TERA GLOBAL JS - DUSRA. Isme playNotificationSound hai -->
    <script src="script.js"></script>

    <!-- 3. PAGE KA ADMIN CODE - TEESRA -->
    <script>
        // Firebase Init
        const firebaseConfig = {
            apiKey: "AIzaSyBPFYE7EUeDJHpTKvBjY6ybHTj-85OYZFY",
            authDomain: "pixelworks-agency.firebaseapp.com",
            databaseURL: "https://pixelworks-agency-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "pixelworks-agency",
            storageBucket: "pixelworks-agency.firebasestorage.app",
            messagingSenderId: "265457916349",
            appId: "1:265457916349:web:1f2f903ed3eaf858c51ad4",
            measurementId: "G-21TVP274BD"
        };
        firebase.initializeApp(firebaseConfig);
        const rtdb = firebase.database();

        let activePhone = null;
        let adminLastMessageCounts = {};

        window.onload = function() {
            if(localStorage.getItem('pixelworks_admin_logged') === 'true') {
                openDashboard();
            }
        };

        function handleLogin(e) {
            e.preventDefault();
            const pass = document.getElementById('passInput').value;
            if(pass === 'm1e2n3u4') {
                localStorage.setItem('pixelworks_admin_logged', 'true');
                openDashboard();
            } else {
                document.getElementById('errorMsg').style.display = 'block';
            }
        }

        function openDashboard() {
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('dashboardSection').style.display = 'flex';
            document.getElementById('logoutBtn').style.display = 'block';
            loadClientsList();
            monitorAdminNotifications();
        }

        function logoutAdmin() {
            localStorage.removeItem('pixelworks_admin_logged');
            location.reload();
        }

        // Firebase se clients list load karo
        function loadClientsList() {
            const listDiv = document.getElementById('sidebarClients');
            rtdb.ref('chats').on('value', (snapshot) => {
                listDiv.innerHTML = '';
                if (!snapshot.exists()) {
                    listDiv.innerHTML = '<p style="color: #9ca3af; font-size: 13px; text-align: center; margin-top: 20px;">Abhi koi client active nahi hai.</p>';
                    return;
                }

                let chats = snapshot.val();
                Object.keys(chats).forEach(phone => {
                    let client = chats[phone];
                    let lastMsg = Object.values(client.messages || {}).pop();

                    const item = document.createElement('div');
                    item.className = 'client-item' + (activePhone === phone? ' active' : '');
                    item.innerHTML = `<strong style="font-size: 14px;">${client.name || phone}</strong><br><span style="font-size: 12px; color: #9ca3af;">${lastMsg? lastMsg.text.substring(0, 30) + '...' : 'Naya chat'}</span>`;

                    item.onclick = function() {
                        activePhone = phone;
                        loadClientsList();
                        openChat(phone);
                    };
                    listDiv.appendChild(item);
                });
            });
        }

        // Firebase se chat load karo
        function openChat(phone) {
            document.getElementById('replyInput').removeAttribute('disabled');
            document.getElementById('sendReplyBtn').removeAttribute('disabled');

            rtdb.ref('chats/' + phone).once('value').then(snapshot => {
                let client = snapshot.val();
                document.getElementById('chatHeaderTitle').textContent = `Chat: ${client.name || phone} (${phone})`;
            });

            const box = document.getElementById('messagesContainer');
            rtdb.ref('chats/' + phone + '/messages').on('value', (snapshot) => {
                box.innerHTML = '';
                if (!snapshot.exists()) return;

                let messagesObj = snapshot.val();
                Object.values(messagesObj).forEach(msg => {
                    const bubble = document.createElement('div');
                    bubble.className = 'msg-bubble';
                    if(msg.sender === 'admin') {
                        bubble.style.background = '#3b82f6';
                        bubble.style.color = '#fff';
                        bubble.style.alignSelf = 'flex-end';
                    } else {
                        bubble.style.background = '#1f2937';
                        bubble.style.color = '#f3f4f6';
                        bubble.style.alignSelf = 'flex-start';
                    }
                    bubble.textContent = msg.text;
                    box.appendChild(bubble);
                });
                box.scrollTop = box.scrollHeight;
            });
        }

        // Firebase me reply bhejo
        function sendReply() {
            const textInput = document.getElementById('replyInput');
            let text = textInput.value.trim();
            if(text && activePhone) {
                rtdb.ref('chats/' + activePhone + '/messages').push({
                    sender: 'admin',
                    text: text,
                    time: Date.now()
                });
                textInput.value = '';
            }
        }

        document.getElementById('replyInput').addEventListener('keypress', function(e) {
            if(e.key === 'Enter') sendReply();
        });

        // Naye message ki notification
        function monitorAdminNotifications() {
            rtdb.ref('chats').on('child_added', () => {}); // listener start
            rtdb.ref('chats').on('child_changed', (snapshot) => {
                let phone = snapshot.key;
                let client = snapshot.val();
                let messages = Object.values(client.messages || {});
                let lastMsg = messages[messages.length - 1];

                if(lastMsg && lastMsg.sender === 'client') {
                    if(adminLastMessageCounts[phone] < messages.length) {
                        if(typeof playNotificationSound === 'function') playNotificationSound(); // check add kiya
                        if(typeof showBrowserNotification === 'function') showBrowserNotification(`Naya Message: ${client.name}`, lastMsg.text);
                    }
                }
                adminLastMessageCounts[phone] = messages.length;
            });
        }
    </script>
</body>
</html>
