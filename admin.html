<!DOCTYPE html>
<html lang="hi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>PixelWorks - Admin Dashboard</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            background-color: #090d16;
            color: #fff;
            margin: 0;
            padding: 0;
            font-family:
                'Segoe UI',
                Tahoma,
                Geneva,
                Verdana,
                sans-serif;
        }

        .page-wrapper {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .login-box {
            max-width: 400px;
            margin: 80px auto;
            padding: 30px;
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 12px;
            text-align: center;
        }

        .dashboard {
            display: none;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 20px;
        }

        .sidebar,
        .main-area {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 10px;
            padding: 18px;
        }

        .sidebar {
            min-height: 600px;
        }

        .main-area {
            min-height: 600px;
        }

        .client-item {
            padding: 12px;
            background: #090d16;
            border: 1px solid #374151;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 8px;
        }

        .client-item:hover,
        .client-item.active {
            border-color: #3b82f6;
            background: #1f2937;
        }

        .input-field {
            width: 100%;
            padding: 12px;
            background: #090d16;
            border: 1px solid #374151;
            border-radius: 8px;
            color: #fff;
            margin-bottom: 12px;
        }

        .btn-main {
            width: 100%;
            padding: 12px;
            background: #3b82f6;
            border: none;
            border-radius: 8px;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-main:hover {
            opacity: .9;
        }

        .btn-danger {
            background: #ef4444;
            border: none;
            color: white;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
        }

        .messages-box {
            height: 400px;
            overflow-y: auto;
            padding: 15px 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .msg-bubble {
            padding: 10px 14px;
            border-radius: 10px;
            max-width: 75%;
            font-size: 13px;
            white-space: pre-wrap;
        }

        .section-box {
            background: #090d16;
            border: 1px solid #374151;
            border-radius: 10px;
            padding: 18px;
            margin-bottom: 20px;
        }

        .section-box h3 {
            margin-top: 0;
        }

        .preview {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 10px 0;
        }

        .preview img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid #374151;
        }

        .portfolio-post {
            background: #090d16;
            border: 1px solid #374151;
            border-radius: 10px;
            padding: 15px;
            margin-top: 12px;
        }

        .portfolio-images {
            display: grid;
            grid-template-columns:
                repeat(auto-fill, minmax(120px, 1fr));
            gap: 8px;
            margin: 12px 0;
        }

        .portfolio-images img {
            width: 100%;
            height: 130px;
            object-fit: cover;
            border-radius: 7px;
        }

        @media (max-width: 800px) {

            .dashboard-grid {
                grid-template-columns: 1fr;
            }

            .sidebar {
                min-height: auto;
            }

            .messages-box {
                height: 350px;
            }

        }

    </style>

</head>


<body>


<div class="page-wrapper">


    <div class="header">

        <h2
            style="
                margin: 0;
                font-size: 20px;
                color: #60a5fa;
            ">

            PixelWorks Admin Portal

        </h2>


        <button
            id="logoutBtn"
            class="btn-danger"
            style="display:none;"
            onclick="logoutAdmin()">

            Logout

        </button>

    </div>



    <!-- LOGIN -->

    <div
        id="loginSection"
        class="login-box">

        <h3>
            Founder Login
        </h3>


        <input
            type="email"
            id="adminEmail"
            class="input-field"
            placeholder="Admin Email">


        <input
            type="password"
            id="adminPassword"
            class="input-field"
            placeholder="Admin Password">


        <button
            id="adminLoginBtn"
            class="btn-main"
            onclick="loginAdmin()">

            Login

        </button>


        <p
            id="loginError"
            style="
                display:none;
                color:#ef4444;
                font-size:13px;
            ">

        </p>

    </div>



    <!-- DASHBOARD -->

    <div
        id="dashboardSection"
        class="dashboard">


        <div class="dashboard-grid">


            <!-- SIDEBAR -->

            <div class="sidebar">

                <h4>
                    Clients
                </h4>


                <div
                    id="sidebarClients">

                    <p
                        style="color:#9ca3af;">

                        Loading...

                    </p>

                </div>

            </div>



            <!-- MAIN -->

            <div class="main-area">


                <!-- CHAT -->

                <div class="section-box">

                    <h3>
                        Client Chat
                    </h3>


                    <div
                        id="chatHeaderTitle"
                        style="
                            color:#60a5fa;
                            margin-bottom:10px;
                        ">

                        Koi client select karein

                    </div>


                    <div
                        id="messagesContainer"
                        class="messages-box">

                        <p
                            style="
                                color:#9ca3af;
                                text-align:center;
                            ">

                            Left menu se client select karein.

                        </p>

                    </div>


                    <div
                        style="
                            display:flex;
                            gap:10px;
                        ">

                        <input
                            type="text"
                            id="replyInput"
                            class="input-field"
                            placeholder="Reply type karein..."
                            disabled
                            style="margin:0;">


                        <button
                            id="sendReplyBtn"
                            class="btn-main"
                            disabled
                            onclick="sendReply()"
                            style="width:auto;">

                            Send

                        </button>

                    </div>

                </div>



                <!-- PORTFOLIO -->

                <div class="section-box">

                    <h3>
                        Portfolio Manager
                    </h3>


                    <input
                        type="text"
                        id="portfolioTitle"
                        class="input-field"
                        placeholder="Post title">


                    <textarea
                        id="portfolioCaption"
                        class="input-field"
                        placeholder="Post ke neeche caption likhein..."
                        rows="4">
                    </textarea>


                    <input
                        type="file"
                        id="portfolioImages"
                        accept="image/*"
                        multiple
                        class="input-field">


                    <div
                        id="imagePreview"
                        class="preview">
                    </div>


                    <button
                        class="btn-main"
                        onclick="createPortfolioPost()">

                        Publish Portfolio Post

                    </button>


                    <p
                        id="portfolioStatus"
                        style="
                            color:#9ca3af;
                            font-size:13px;
                        ">

                    </p>

                </div>



                <!-- POSTS -->

                <div class="section-box">

                    <h3>
                        Published Portfolio Posts
                    </h3>


                    <div
                        id="portfolioPosts">

                        Loading...

                    </div>

                </div>


            </div>

        </div>

    </div>

</div>



<!-- FIREBASE -->

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>


<script>

const firebaseConfig = {

    apiKey:
        "AIzaSyBPFYE7EUeDJHpTKvBjY6ybHTj-85OYZFY",

    authDomain:
        "pixelworks-agency.firebaseapp.com",

    databaseURL:
        "https://pixelworks-agency-default-rtdb.asia-southeast1.firebasedatabase.app",

    projectId:
        "pixelworks-agency",

    storageBucket:
        "pixelworks-agency.firebasestorage.app",

    messagingSenderId:
        "265457916349",

    appId:
        "1:265457916349:web:1f2f903ed3eaf858c51ad4",

    measurementId:
        "G-21TVP274BD"

};


firebase.initializeApp(firebaseConfig);


const auth =
    firebase.auth();


const rtdb =
    firebase.database();


const storage =
    firebase.storage();



/*
 ADMIN UID
*/

const ADMIN_UID =
    "MSbStxjennTwlhhW8cT75ONjRrm2";


let activePhone = null;



/*
 AUTH STATE
*/

auth.onAuthStateChanged(
    async function(user) {

        if (!user) {

            showLogin();

            return;

        }


        if (user.uid !== ADMIN_UID) {

            await auth.signOut();

            showLogin();

            document.getElementById(
                "loginError"
            ).textContent =
                "Is account ko admin access nahi hai.";

            document.getElementById(
                "loginError"
            ).style.display =
                "block";

            return;

        }


        openDashboard();

    }
);



/*
 LOGIN
*/

async function loginAdmin() {

    const email =
        document
            .getElementById("adminEmail")
            .value
            .trim();


    const password =
        document
            .getElementById("adminPassword")
            .value;


    const error =
        document.getElementById(
            "loginError"
        );


    error.style.display =
        "none";


    if (!email || !password) {

        error.textContent =
            "Email aur password bharo.";

        error.style.display =
            "block";

        return;

    }


    try {

        await auth.signInWithEmailAndPassword(
            email,
            password
        );

    } catch (e) {

        console.error(e);

        error.textContent =
            "Email ya password galat hai.";

        error.style.display =
            "block";

    }

}



/*
 SHOW LOGIN
*/

function showLogin() {

    document.getElementById(
        "loginSection"
    ).style.display =
        "block";


    document.getElementById(
        "dashboardSection"
    ).style.display =
        "none";


    document.getElementById(
        "logoutBtn"
    ).style.display =
        "none";

}



/*
 OPEN DASHBOARD
*/

function openDashboard() {

    document.getElementById(
        "loginSection"
    ).style.display =
        "none";


    document.getElementById(
        "dashboardSection"
    ).style.display =
        "block";


    document.getElementById(
        "logoutBtn"
    ).style.display =
        "block";


    loadClientsList();

    loadPortfolioPosts();

}



/*
 LOGOUT
*/

async function logoutAdmin() {

    await auth.signOut();

}



/*
 CLIENT LIST
*/

function loadClientsList() {

    const list =
        document.getElementById(
            "sidebarClients"
        );


    rtdb
        .ref("chats")
        .on("value", function(snapshot) {

            list.innerHTML = "";


            if (!snapshot.exists()) {

                list.innerHTML =
                    "<p style='color:#9ca3af;'>No clients.</p>";

                return;

            }


            const chats =
                snapshot.val();


            Object.keys(chats).forEach(
                function(phone) {

                    const client =
                        chats[phone];


                    const messages =
                        Object.values(
                            client.messages || {}
                        );


                    const last =
                        messages[
                            messages.length - 1
                        ];


                    const item =
                        document.createElement(
                            "div"
                        );


                    item.className =
                        "client-item";


                    if (
                        activePhone === phone
                    ) {

                        item.classList.add(
                            "active"
                        );

                    }


                    item.innerHTML =

                        "<strong>" +

                        (
                            client.name ||
                            phone
                        ) +

                        "</strong><br>" +

                        "<span style='font-size:12px;color:#9ca3af;'>" +

                        (
                            last
                                ? last.text.substring(
                                    0,
                                    35
                                )
                                : "Naya chat"
                        ) +

                        "</span>";


                    item.onclick =
                        function() {

                            activePhone =
                                phone;

                            openChat(phone);

                            loadClientsList();

                        };


                    list.appendChild(item);

                }
            );

        });

}



/*
 OPEN CHAT
*/

function openChat(phone) {

    document
        .getElementById(
            "replyInput"
        )
        .disabled =
        false;


    document
        .getElementById(
            "sendReplyBtn"
        )
        .disabled =
        false;


    rtdb
        .ref("chats/" + phone)
        .once("value")
        .then(function(snapshot) {

            const client =
                snapshot.val();


            document.getElementById(
                "chatHeaderTitle"
            ).textContent =
                "Chat: " +
                (
                    client.name ||
                    phone
                );

        });


    rtdb
        .ref(
            "chats/" +
            phone +
            "/messages"
        )
        .on("value", function(snapshot) {

            const box =
                document.getElementById(
                    "messagesContainer"
                );


            box.innerHTML = "";


            if (!snapshot.exists()) {

                return;

            }


            Object.values(
                snapshot.val()
            ).forEach(
                function(msg) {

                    const bubble =
                        document.createElement(
                            "div"
                        );


                    bubble.className =
                        "msg-bubble";


                    bubble.textContent =
                        msg.text;


                    if (
                        msg.sender ===
                        "admin"
                    ) {

                        bubble.style.background =
                            "#3b82f6";

                        bubble.style.alignSelf =
                            "flex-end";

                    } else {

                        bubble.style.background =
                            "#1f2937";

                        bubble.style.alignSelf =
                            "flex-start";

                    }


                    box.appendChild(
                        bubble
                    );

                }
            );


            box.scrollTop =
                box.scrollHeight;

        });

}



/*
 SEND REPLY
*/

function sendReply() {

    const input =
        document.getElementById(
            "replyInput"
        );


    const text =
        input.value.trim();


    if (!text || !activePhone) {

        return;

    }


    rtdb
        .ref(
            "chats/" +
            activePhone +
            "/messages"
        )
        .push({

            sender:
                "admin",

            text:
                text,

            time:
                Date.now()

        });


    input.value = "";

}



/*
 ENTER TO SEND
*/

document
    .getElementById(
        "replyInput"
    )
    .addEventListener(
        "keypress",
        function(e) {

            if (
                e.key === "Enter"
            ) {

                sendReply();

            }

        }
    );



/*
 IMAGE PREVIEW
*/

document
    .getElementById(
        "portfolioImages"
    )
    .addEventListener(
        "change",
        function() {

            const preview =
                document.getElementById(
                    "imagePreview"
                );


            preview.innerHTML = "";


            Array.from(
                this.files
            ).forEach(
                function(file) {

                    const reader =
                        new FileReader();


                    reader.onload =
                        function(e) {

                            const img =
                                document.createElement(
                                    "img"
                                );


                            img.src =
                                e.target.result;


                            preview.appendChild(
                                img
                            );

                        };


                    reader.readAsDataURL(
                        file
                    );

                }
            );

        }
    );



/*
 CREATE PORTFOLIO POST
*/

async function createPortfolioPost() {

    const title =
        document
            .getElementById(
                "portfolioTitle"
            )
            .value
            .trim();


    const caption =
        document
            .getElementById(
                "portfolioCaption"
            )
            .value
            .trim();


    const files =
        document
            .getElementById(
                "portfolioImages"
            )
            .files;


    const status =
        document.getElementById(
            "portfolioStatus"
        );


    if (!files.length) {

        status.textContent =
            "Kam se kam ek image select karo.";

        return;

    }


    status.textContent =
        "Images upload ho rahi hain...";


    try {

        const imageUrls = [];


        for (
            let i = 0;
            i < files.length;
            i++
        ) {

            const file =
                files[i];


            const fileName =
                Date.now() +
                "_" +
                i +
                "_" +
                file.name;


            const storageRef =
                storage.ref(
                    "portfolio/" +
                    fileName
                );


            await storageRef.put(
                file
            );


            const url =
                await storageRef.getDownloadURL();


            imageUrls.push(url);

        }


        /*
         SAVE POST
        */

        await rtdb
            .ref("portfolio")
            .push({

                title:
                    title,

                caption:
                    caption,

                images:
                    imageUrls,

                createdAt:
                    Date.now(),

                createdBy:
                    auth.currentUser.uid

            });


        status.textContent =
            "Portfolio post successfully publish ho gaya!";


        document.getElementById(
            "portfolioTitle"
        ).value = "";


        document.getElementById(
            "portfolioCaption"
        ).value = "";


        document.getElementById(
            "portfolioImages"
        ).value = "";


        document.getElementById(
            "imagePreview"
        ).innerHTML = "";


        loadPortfolioPosts();


    } catch (error) {

        console.error(error);

        status.textContent =
            "Upload error: " +
            error.message;

    }

}



/*
 LOAD PORTFOLIO POSTS
*/

function loadPortfolioPosts() {

    rtdb
        .ref("portfolio")
        .on("value", function(snapshot) {

            const container =
                document.getElementById(
                    "portfolioPosts"
                );


            container.innerHTML = "";


            if (!snapshot.exists()) {

                container.innerHTML =
                    "<p style='color:#9ca3af;'>Abhi koi portfolio post nahi hai.</p>";

                return;

            }


            const posts =
                snapshot.val();


            Object.entries(posts)
                .reverse()
                .forEach(
                    function([id, post]) {

                        const article =
                            document.createElement(
                                "div"
                            );


                        article.className =
                            "portfolio-post";


                        let imagesHTML =
                            "";


                        (
                            post.images ||
                            []
                        ).forEach(
                            function(url) {

                                imagesHTML +=
                                    "<img src='" +
                                    url +
                                    "'>";

                            }
                        );


                        article.innerHTML =

                            "<h4>" +

                            (
                                post.title ||
                                "Untitled"
                            ) +

                            "</h4>" +

                            "<p style='color:#9ca3af;'>" +

                            (
                                post.caption ||
                                ""
                            ) +

                            "</p>" +

                            "<div class='portfolio-images'>" +

                            imagesHTML +

                            "</div>" +

                            "<button class='btn-danger' onclick=\"deletePortfolioPost('" +
                            id +
                            "')\">" +

                            "Delete Post" +

                            "</button>";


                        container.appendChild(
                            article
                        );

                    }
                );

        });

}



/*
 DELETE PORTFOLIO POST

Note:
Database post delete hota hai.
Storage files later clean-up karenge.
*/

async function deletePortfolioPost(id) {

    const confirmDelete =
        confirm(
            "Kya tum ye portfolio post delete karna chahte ho?"
        );


    if (!confirmDelete) {

        return;

    }


    try {

        await rtdb
            .ref(
                "portfolio/" +
                id
            )
            .remove();


    } catch (error) {

        alert(
            "Delete error: " +
            error.message
        );

    }

}

</script>


</body>
</html>
