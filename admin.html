<!DOCTYPE html>
<html lang="hi">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>PixelWorks - Admin Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background: #090d16;
            color: #fff;
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .page-wrapper {
            max-width: 1200px;
            margin: auto;
            padding: 20px;
            min-height: 100vh;
        }

        /* HEADER */

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;

            padding: 15px 20px;

            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 12px;

            margin-bottom: 20px;
        }

        .header h2 {
            margin: 0;
            font-size: 20px;
            color: #60a5fa;
        }

        /* LOGIN */

        .login-box {
            max-width: 400px;
            margin: 80px auto;

            padding: 30px;

            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 15px;

            text-align: center;
        }

        .input-field {
            width: 100%;

            padding: 12px;

            background: #090d16;
            border: 1px solid #374151;

            border-radius: 8px;

            color: white;

            margin-bottom: 12px;
            outline: none;
        }

        .input-field:focus {
            border-color: #3b82f6;
        }

        textarea.input-field {
            min-height: 120px;
            resize: vertical;
        }

        .btn-main {
            width: 100%;

            padding: 12px;

            background: #3b82f6;

            border: none;
            border-radius: 8px;

            color: white;

            font-weight: 600;

            cursor: pointer;
        }

        .btn-main:hover {
            background: #2563eb;
        }

        .logout-btn {
            background: #ef4444;
            border: none;

            color: white;

            padding: 8px 14px;

            border-radius: 7px;

            cursor: pointer;
        }

        /* DASHBOARD */

        .dashboard {
            display: none;

            gap: 20px;
        }

        .sidebar {
            width: 280px;

            background: #111827;

            border: 1px solid #1f2937;

            border-radius: 12px;

            padding: 15px;

            height: calc(100vh - 130px);

            overflow-y: auto;
        }

        .main-area {
            flex: 1;

            background: #111827;

            border: 1px solid #1f2937;

            border-radius: 12px;

            padding: 20px;

            min-width: 0;
        }

        /* SIDEBAR */

        .menu-btn {
            width: 100%;

            padding: 12px;

            margin-bottom: 8px;

            border: 1px solid #374151;

            background: #090d16;

            color: white;

            border-radius: 8px;

            cursor: pointer;

            text-align: left;
        }

        .menu-btn:hover,
        .menu-btn.active {
            border-color: #3b82f6;
            background: #172033;
        }

        /* CLIENTS */

        .client-item {
            padding: 12px;

            background: #090d16;

            border: 1px solid #374151;

            border-radius: 8px;

            cursor: pointer;

            margin-bottom: 8px;
        }

        .client-item:hover,
        .client-item.active {
            border-color: #3b82f6;
        }

        /* SECTIONS */

        .admin-section {
            display: none;
        }

        .admin-section.active {
            display: block;
        }

        /* PORTFOLIO */

        .portfolio-form {
            background: #090d16;

            border: 1px solid #374151;

            border-radius: 12px;

            padding: 20px;

            margin-bottom: 25px;
        }

        .portfolio-form h3 {
            margin-top: 0;
        }

        .file-input {
            width: 100%;

            padding: 12px;

            border: 1px dashed #4b5563;

            border-radius: 8px;

            background: #111827;

            color: #aaa;

            margin-bottom: 15px;
        }

        .image-preview {
            display: grid;

            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));

            gap: 10px;

            margin-bottom: 15px;
        }

        .image-preview img {
            width: 100%;
            height: 100px;

            object-fit: cover;

            border-radius: 8px;

            border: 1px solid #374151;
        }

        .post-card {
            background: #090d16;

            border: 1px solid #374151;

            border-radius: 12px;

            padding: 15px;

            margin-bottom: 15px;
        }

        .post-images {
            display: grid;

            grid-template-columns: repeat(3, 1fr);

            gap: 5px;

            margin: 12px 0;
        }

        .post-images img {
            width: 100%;
            height: 120px;

            object-fit: cover;

            border-radius: 6px;
        }

        .tag {
            display: inline-block;

            color: #60a5fa;

            font-size: 13px;

            margin-right: 8px;
        }

        .delete-btn {
            background: #dc2626;

            border: none;

            color: white;

            padding: 8px 12px;

            border-radius: 7px;

            cursor: pointer;
        }

        /* CHAT */

        .chat-layout {
            display: flex;
            gap: 15px;
        }

        .chat-clients {
            width: 250px;

            max-height: 600px;

            overflow-y: auto;
        }

        .chat-box {
            flex: 1;

            min-width: 0;

            background: #090d16;

            border: 1px solid #374151;

            border-radius: 10px;

            padding: 15px;
        }

        .messages-box {
            height: 450px;

            overflow-y: auto;

            display: flex;

            flex-direction: column;

            gap: 10px;

            padding: 15px 0;
        }

        .msg-bubble {
            padding: 10px 14px;

            border-radius: 10px;

            max-width: 75%;

            font-size: 13px;

            white-space: pre-wrap;
        }

        .chat-input {
            display: flex;

            gap: 10px;

            border-top: 1px solid #374151;

            padding-top: 12px;
        }

        /* MOBILE */

        @media(max-width: 750px) {

            .dashboard {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                height: auto;
            }

            .chat-layout {
                flex-direction: column;
            }

            .chat-clients {
                width: 100%;
            }

            .post-images {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>

<body>

<div class="page-wrapper">

    <!-- HEADER -->

    <header class="header">

        <h2>
            PixelWorks Admin Portal
        </h2>

        <button
            id="logoutBtn"
            class="logout-btn"
            style="display:none;"
            onclick="logoutAdmin()">

            Logout

        </button>

    </header>


    <!-- LOGIN -->

    <section
        id="loginSection"
        class="login-box">

        <h3>
            Founder Login
        </h3>

        <p style="color:#9ca3af;font-size:13px;">
            Admin account se login karein.
        </p>

        <form onsubmit="handleLogin(event)">

            <input
                type="email"
                id="emailInput"
                class="input-field"
                placeholder="Admin Email"
                required>

            <input
                type="password"
                id="passInput"
                class="input-field"
                placeholder="Password"
                required>

            <button
                type="submit"
                class="btn-main">

                Login

            </button>

        </form>

        <p
            id="errorMsg"
            style="display:none;color:#ef4444;font-size:13px;">
        </p>

    </section>


    <!-- DASHBOARD -->

    <section
        id="dashboardSection"
        class="dashboard">

        <!-- SIDEBAR -->

        <aside class="sidebar">

            <button
                class="menu-btn active"
                onclick="showSection('portfolioSection', this)">

                📁 Portfolio Manager

            </button>

            <button
                class="menu-btn"
                onclick="showSection('chatSection', this)">

                💬 Client Chats

            </button>

        </aside>


        <!-- MAIN -->

        <main class="main-area">


            <!-- ========================= -->
            <!-- PORTFOLIO SECTION -->
            <!-- ========================= -->

            <section
                id="portfolioSection"
                class="admin-section active">

                <h2>
                    Portfolio Manager
                </h2>

                <p style="color:#9ca3af;">
                    Yahin se portfolio me naye projects publish karein.
                </p>


                <!-- CREATE POST -->

                <div class="portfolio-form">

                    <h3>
                        Create New Post
                    </h3>


                    <input
                        type="text"
                        id="postTitle"
                        class="input-field"
                        placeholder="Project Title"
                        required>


                    <textarea
                        id="postDescription"
                        class="input-field"
                        placeholder="Project Description"></textarea>


                    <input
                        type="text"
                        id="postTags"
                        class="input-field"
                        placeholder="Tags — example: Web Design, UI/UX, React">


                    <label style="display:block;margin-bottom:8px;">
                        Project Images
                    </label>

                    <input
                        type="file"
                        id="postImages"
                        class="file-input"
                        accept="image/*"
                        multiple>


                    <!-- IMAGE PREVIEW -->

                    <div
                        id="imagePreview"
                        class="image-preview">
                    </div>


                    <button
                        class="btn-main"
                        onclick="publishPost()">

                        🚀 Publish Post

                    </button>


                    <p
                        id="uploadStatus"
                        style="font-size:13px;color:#60a5fa;">
                    </p>

                </div>


                <!-- POSTS -->

                <h3>
                    Published Posts
                </h3>

                <div id="adminPosts">

                    <p style="color:#9ca3af;">
                        Posts loading...
                    </p>

                </div>

            </section>


            <!-- ========================= -->
            <!-- CHAT SECTION -->
            <!-- ========================= -->

            <section
                id="chatSection"
                class="admin-section">

                <h2>
                    Client Chats
                </h2>


                <div class="chat-layout">

                    <div class="chat-clients">

                        <h4>
                            Clients
                        </h4>

                        <div id="sidebarClients"></div>

                    </div>


                    <div class="chat-box">

                        <div
                            id="chatHeaderTitle"
                            style="border-bottom:1px solid #374151;padding-bottom:10px;">

                            Koi client select karein

                        </div>


                        <div
                            id="messagesContainer"
                            class="messages-box">

                            <p
                                style="color:#9ca3af;text-align:center;">

                                Client select karein.

                            </p>

                        </div>


                        <div class="chat-input">

                            <input
                                type="text"
                                id="replyInput"
                                class="input-field"
                                style="margin:0;"
                                placeholder="Reply..."
                                disabled>


                            <button
                                id="sendReplyBtn"
                                onclick="sendReply()"
                                class="btn-main"
                                style="width:auto;"
                                disabled>

                                Send

                            </button>

                        </div>

                    </div>

                </div>

            </section>

        </main>

    </section>

</div>


<!-- FIREBASE -->

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>


<script>

    /* =========================================
       FIREBASE CONFIG
    ========================================= */

    const firebaseConfig = {

        apiKey: "AIzaSyBPFYE7EUeDJHpTKvBjY6ybHTj-85OYZFY",

        authDomain:
            "pixelworks-agency.firebaseapp.com",

        databaseURL:
            "https://pixelworks-agency-default-rtdb.asia-southeast1.firebasedatabase.app",

        projectId:
            "pixelworks-agency",

        storageBucket:
            "pixelworks-agency.firebasestorage.app",

        messagingSenderId:
            "265457916349",

        appId:
            "1:265457916349:web:1f2f903ed3eaf858c51ad4",

        measurementId:
            "G-21TVP274BD"
    };


    firebase.initializeApp(firebaseConfig);


    const auth =
        firebase.auth();

    const rtdb =
        firebase.database();

    const storage =
        firebase.storage();


    /* =========================================
       ADMIN AUTHENTICATION
    ========================================= */

    auth.onAuthStateChanged(function(user) {

        if (user) {

            openDashboard();

        } else {

            document
                .getElementById("loginSection")
                .style.display = "block";

            document
                .getElementById("dashboardSection")
                .style.display = "none";

            document
                .getElementById("logoutBtn")
                .style.display = "none";
        }

    });


    function handleLogin(e) {

        e.preventDefault();


        const email =
            document
                .getElementById("emailInput")
                .value
                .trim();


        const password =
            document
                .getElementById("passInput")
                .value;


        auth.signInWithEmailAndPassword(
            email,
            password
        )

        .then(function() {

            document
                .getElementById("errorMsg")
                .style.display = "none";

        })

        .catch(function(error) {

            const errorMsg =
                document.getElementById("errorMsg");

            errorMsg.textContent =
                "Login failed: " + error.message;

            errorMsg.style.display = "block";

        });

    }


    function logoutAdmin() {

        auth.signOut();

    }


    function openDashboard() {

        document
            .getElementById("loginSection")
            .style.display = "none";


        document
            .getElementById("dashboardSection")
            .style.display = "flex";


        document
            .getElementById("logoutBtn")
            .style.display = "block";


        loadPortfolioPosts();

        loadClientsList();

    }


    /* =========================================
       SECTION SWITCHING
    ========================================= */

    function showSection(sectionId, button) {

        document
            .querySelectorAll(".admin-section")
            .forEach(function(section) {

                section.classList.remove("active");

            });


        document
            .getElementById(sectionId)
            .classList.add("active");


        document
            .querySelectorAll(".menu-btn")
            .forEach(function(btn) {

                btn.classList.remove("active");

            });


        button.classList.add("active");

    }


    /* =========================================
       IMAGE PREVIEW
    ========================================= */

    document
        .getElementById("postImages")
        .addEventListener("change", function() {

            const preview =
                document.getElementById("imagePreview");

            preview.innerHTML = "";


            const files = this.files;


            Array.from(files).forEach(function(file) {

                if (!file.type.startsWith("image/")) {
                    return;
                }


                const img =
                    document.createElement("img");


                img.src =
                    URL.createObjectURL(file);


                preview.appendChild(img);

            });

        });


    /* =========================================
       CREATE PORTFOLIO POST
    ========================================= */

    async function publishPost() {

        if (!auth.currentUser) {

            alert("Pehle admin login karein.");

            return;
        }


        const title =
            document
                .getElementById("postTitle")
                .value
                .trim();


        const description =
            document
                .getElementById("postDescription")
                .value
                .trim();


        const tagsText =
            document
                .getElementById("postTags")
                .value
                .trim();


        const files =
            document
                .getElementById("postImages")
                .files;


        const status =
            document
                .getElementById("uploadStatus");


        if (!title) {

            alert("Project title likho.");

            return;
        }


        if (!files.length) {

            alert("Kam se kam ek image select karo.");

            return;
        }


        status.textContent =
            "Images upload ho rahi hain...";


        try {

            const postRef =
                rtdb.ref("portfolio").push();


            const postId =
                postRef.key;


            const imageUrls = [];


            for (
                let i = 0;
                i < files.length;
                i++
            ) {

                const file = files[i];


                const extension =
                    file.name
                        .split(".")
                        .pop();


                const filePath =
                    `portfolio/${postId}/${Date.now()}_${i}.${extension}`;


                const storageRef =
                    storage.ref(filePath);


                await storageRef.put(file);


                const downloadURL =
                    await storageRef.getDownloadURL();


                imageUrls.push(downloadURL);


                status.textContent =
                    `Image ${i + 1}/${files.length} uploaded...`;

            }


            const tags =
                tagsText
                    ? tagsText
                        .split(",")
                        .map(tag => tag.trim())
                        .filter(Boolean)
                    : [];


            await postRef.set({

                title: title,

                description: description,

                tags: tags,

                images: imageUrls,

                createdAt: firebase.database.ServerValue.TIMESTAMP,

                createdBy:
                    auth.currentUser.uid

            });


            status.textContent =
                "✅ Post successfully published!";


            document
                .getElementById("postTitle")
                .value = "";


            document
                .getElementById("postDescription")
                .value = "";


            document
                .getElementById("postTags")
                .value = "";


            document
                .getElementById("postImages")
                .value = "";


            document
                .getElementById("imagePreview")
                .innerHTML = "";


            loadPortfolioPosts();

        }

        catch(error) {

            console.error(error);

            status.textContent =
                "❌ Upload failed: " + error.message;

        }

    }


    /* =========================================
       LOAD PORTFOLIO POSTS
    ========================================= */

    function loadPortfolioPosts() {

        const container =
            document.getElementById("adminPosts");


        rtdb.ref("portfolio")
            .orderByChild("createdAt")
            .on("value", function(snapshot) {

                container.innerHTML = "";


                if (!snapshot.exists()) {

                    container.innerHTML =
                        `<p style="color:#9ca3af;">
                            Abhi koi portfolio post nahi hai.
                        </p>`;

                    return;
                }


                const posts = [];


                snapshot.forEach(function(child) {

                    posts.push({

                        id: child.key,

                        ...child.val()

                    });

                });


                posts.reverse();


                posts.forEach(function(post) {

                    const card =
                        document.createElement("div");


                    card.className =
                        "post-card";


                    let imagesHTML = "";


                    (post.images || [])
                        .forEach(function(url) {

                            imagesHTML += `
                                <img
                                    src="${url}"
                                    alt="Project image">
                            `;

                        });


                    let tagsHTML = "";


                    (post.tags || [])
                        .forEach(function(tag) {

                            tagsHTML += `
                                <span class="tag">
                                    #${escapeHTML(tag)}
                                </span>
                            `;

                        });


                    card.innerHTML = `

                        <h3>
                            ${escapeHTML(post.title || "")}
                        </h3>

                        <p style="color:#9ca3af;">
                            ${escapeHTML(post.description || "")}
                        </p>

                        <div class="post-images">
                            ${imagesHTML}
                        </div>

                        <div>
                            ${tagsHTML}
                        </div>

                        <br>

                        <button
                            class="delete-btn"
                            onclick="deletePost('${post.id}')">

                            Delete Post

                        </button>

                    `;


                    container.appendChild(card);

                });

            });

    }


    /* =========================================
       DELETE POST
    ========================================= */

    async function deletePost(postId) {

        if (!auth.currentUser) {

            return;

        }


        const confirmDelete =
            confirm(
                "Kya tum ye portfolio post delete karna chahte ho?"
            );


        if (!confirmDelete) {

            return;

        }


        try {

            const postSnapshot =
                await rtdb
                    .ref("portfolio/" + postId)
                    .once("value");


            const post =
                postSnapshot.val();


            /* Delete images from Storage */

            if (post && post.images) {

                for (
                    const imageUrl of post.images
                ) {

                    try {

                        const imageRef =
                            storage.refFromURL(imageUrl);

                        await imageRef.delete();

                    }

                    catch(error) {

                        console.log(
                            "Image delete skipped:",
                            error.message
                        );

                    }

                }

            }


            /* Delete database post */

            await rtdb
                .ref("portfolio/" + postId)
                .remove();


            alert("Post delete ho gaya.");

        }

        catch(error) {

            console.error(error);

            alert(
                "Delete failed: " +
                error.message
            );

        }

    }


    /* =========================================
       SECURITY — HTML ESCAPE
    ========================================= */

    function escapeHTML(value) {

        return String(value)

            .replaceAll("&", "&amp;")

            .replaceAll("<", "&lt;")

            .replaceAll(">", "&gt;")

            .replaceAll('"', "&quot;")

            .replaceAll("'", "&#039;");

    }


    /* =========================================
       CLIENT CHAT
    ========================================= */

    let activePhone = null;


    function loadClientsList() {

        const listDiv =
            document.getElementById(
                "sidebarClients"
            );


        rtdb.ref("chats").on(
            "value",
            function(snapshot) {

                listDiv.innerHTML = "";


                if (!snapshot.exists()) {

                    listDiv.innerHTML =
                        `<p style="color:#9ca3af;">
                            Koi client nahi.
                        </p>`;

                    return;
                }


                const chats =
                    snapshot.val();


                Object.keys(chats)
                    .forEach(function(phone) {

                        const client =
                            chats[phone];


                        const messages =
                            Object.values(
                                client.messages || {}
                            );


                        const lastMsg =
                            messages[messages.length - 1];


                        const item =
                            document.createElement(
                                "div"
                            );


                        item.className =
                            "client-item" +
                            (
                                activePhone === phone
                                    ? " active"
                                    : ""
                            );


                        item.innerHTML = `

                            <strong>
                                ${escapeHTML(
                                    client.name ||
                                    phone
                                )}
                            </strong>

                            <br>

                            <span style="
                                font-size:12px;
                                color:#9ca3af;
                            ">

                                ${
                                    lastMsg
                                        ? escapeHTML(
                                            lastMsg.text
                                                .substring(
                                                    0,
                                                    30
                                                )
                                          ) + "..."
                                        : "Naya chat"
                                }

                            </span>

                        `;


                        item.onclick =
                            function() {

                                activePhone =
                                    phone;

                                loadClientsList();

                                openChat(phone);

                            };


                        listDiv.appendChild(item);

                    });

            }
        );

    }


    function openChat(phone) {

        document
            .getElementById("replyInput")
            .disabled = false;


        document
            .getElementById("sendReplyBtn")
            .disabled = false;


        rtdb
            .ref("chats/" + phone)
            .once("value")
            .then(function(snapshot) {

                const client =
                    snapshot.val();


                document
                    .getElementById(
                        "chatHeaderTitle"
                    )
                    .textContent =
                    `Chat: ${
                        client.name || phone
                    } (${phone})`;

            });


        const box =
            document.getElementById(
                "messagesContainer"
            );


        rtdb
            .ref(
                "chats/" +
                phone +
                "/messages"
            )
            .on(
                "value",
                function(snapshot) {

                    box.innerHTML = "";


                    if (!snapshot.exists()) {

                        return;

                    }


                    const messages =
                        snapshot.val();


                    Object.values(messages)
                        .forEach(function(msg) {

                            const bubble =
                                document.createElement(
                                    "div"
                                );


                            bubble.className =
                                "msg-bubble";


                            bubble.textContent =
                                msg.text;


                            if (
                                msg.sender ===
                                "admin"
                            ) {

                                bubble.style.background =
                                    "#3b82f6";

                                bubble.style.alignSelf =
                                    "flex-end";

                            }

                            else {

                                bubble.style.background =
                                    "#1f2937";

                                bubble.style.alignSelf =
                                    "flex-start";

                            }


                            box.appendChild(
                                bubble
                            );

                        });


                    box.scrollTop =
                        box.scrollHeight;

                }
            );

    }


    function sendReply() {

        const input =
            document.getElementById(
                "replyInput"
            );


        const text =
            input.value.trim();


        if (
            !text ||
            !activePhone
        ) {

            return;

        }


        rtdb
            .ref(
                "chats/" +
                activePhone +
                "/messages"
            )
            .push({

                sender: "admin",

                text: text,

                time: Date.now()

            });


        input.value = "";

    }


    document
        .getElementById("replyInput")
        .addEventListener(
            "keypress",
            function(e) {

                if (e.key === "Enter") {

                    sendReply();

                }

            }
        );

</script>

</body>
</html>
