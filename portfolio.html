<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>PixelWorks - Portfolio</title>

    <link rel="stylesheet" href="style.css">

    <style>

        body {
            background: #090d16;
            color: white;
        }


        .portfolio-page {

            max-width: 650px;

            margin: auto;

            padding:
                120px
                15px
                50px;

        }


        .portfolio-heading {

            text-align: center;

            margin-bottom: 35px;

        }


        .portfolio-heading h1 {

            font-size: 42px;

            margin-bottom: 10px;

        }


        .portfolio-heading p {

            color: #9ca3af;

            line-height: 1.6;

        }


        .portfolio-post {

            background: #111827;

            border:
                1px solid
                #1f2937;

            border-radius: 14px;

            overflow: hidden;

            margin-bottom: 30px;

        }


        /* IMAGE AREA */

        .post-image-container {

            position: relative;

            width: 100%;

            aspect-ratio: 1 / 1;

            background: #05070c;

            overflow: hidden;

        }


        .post-image {

            width: 100%;

            height: 100%;

            object-fit: cover;

            display: block;

        }


        /* ARROWS */

        .image-arrow {

            position: absolute;

            top: 50%;

            transform:
                translateY(-50%);

            width: 38px;

            height: 38px;

            border-radius: 50%;

            border: none;

            background:
                rgba(0,0,0,0.65);

            color: white;

            font-size: 22px;

            cursor: pointer;

        }


        .prev {

            left: 12px;

        }


        .next {

            right: 12px;

        }


        /* DOTS */

        .image-dots {

            position: absolute;

            bottom: 12px;

            left: 0;

            right: 0;

            text-align: center;

        }


        .dot {

            display: inline-block;

            width: 7px;

            height: 7px;

            border-radius: 50%;

            background: #6b7280;

            margin: 0 3px;

        }


        .dot.active {

            background: #3b82f6;

        }


        /* CONTENT */

        .post-content {

            padding: 20px;

        }


        .post-title {

            font-size: 21px;

            margin:
                0
                0
                10px;

        }


        .post-description {

            color: #9ca3af;

            font-size: 14px;

            line-height: 1.7;

            margin: 0;

            white-space: pre-wrap;

        }


        .post-date {

            color: #6b7280;

            font-size: 12px;

            margin-top: 15px;

        }


        .empty {

            text-align: center;

            color: #9ca3af;

            padding: 50px 10px;

        }


        @media(max-width:600px) {

            .portfolio-heading h1 {

                font-size: 32px;

            }

            .portfolio-page {

                padding-top: 110px;

            }

        }

    </style>

</head>


<body>


<!-- HEADER -->

<header>

    <div class="nav-container">

        <a
            href="index.html"
            class="logo">

            PixelWorks

        </a>


        <div
            class="hamburger"
            id="hamburger">

            <span></span>

            <span></span>

            <span></span>

        </div>


        <ul
            class="nav-links"
            id="navLinks">

            <li>
                <a href="index.html">
                    Home
                </a>
            </li>

            <li>
                <a href="services.html">
                    Services
                </a>
            </li>

            <li>
                <a href="portfolio.html">
                    Portfolio
                </a>
            </li>

            <li>
                <a href="contact.html">
                    Contact
                </a>
            </li>

        </ul>

    </div>

</header>


<!-- PORTFOLIO -->

<main class="portfolio-page">


    <div class="portfolio-heading">

        <h1>
            Our Work
        </h1>

        <p>
            Real projects. Real designs.
            Premium digital experiences built
            for modern businesses.
        </p>

    </div>


    <div id="portfolioPosts">

        <div class="empty">
            Portfolio posts load ho rahi hain...
        </div>

    </div>


</main>


<!-- FIREBASE -->

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

<script src="script.js"></script>


<script>

const firebaseConfig = {

    apiKey: "AIzaSyBPFYE7EUeDJHpTKvBjY6ybHTj-85OYZFY",

    authDomain:
        "pixelworks-agency.firebaseapp.com",

    databaseURL:
        "https://pixelworks-agency-default-rtdb.asia-southeast1.firebasedatabase.app",

    projectId:
        "pixelworks-agency",

    storageBucket:
        "pixelworks-agency.firebasestorage.app",

    messagingSenderId:
        "265457916349",

    appId:
        "1:265457916349:web:1f2f903ed3eaf858c51ad4",

    measurementId:
        "G-21TVP274BD"

};


firebase.initializeApp(firebaseConfig);

const db =
    firebase.database();


/* =========================
   LOAD PORTFOLIO
========================= */

db.ref("portfolioPosts")
.on("value", function(snapshot) {

    const container =
        document.getElementById(
            "portfolioPosts"
        );


    container.innerHTML = "";


    if (!snapshot.exists()) {

        container.innerHTML = `
            <div class="empty">
                Abhi portfolio me koi project nahi hai.
            </div>
        `;

        return;
    }


    const posts = [];


    snapshot.forEach(function(child) {

        posts.push({

            id: child.key,

            ...child.val()

        });

    });


    /* NEWEST FIRST */

    posts.sort(function(a,b) {

        return (
            (b.createdAt || 0) -
            (a.createdAt || 0)
        );

    });


    posts.forEach(function(post) {

        createPost(post, container);

    });

});


/* =========================
   CREATE POST
========================= */

function createPost(post, container) {

    const postElement =
        document.createElement("article");


    postElement.className =
        "portfolio-post";


    const imageContainer =
        document.createElement("div");


    imageContainer.className =
        "post-image-container";


    const images =
        Array.isArray(post.images)
        ? post.images
        : Object.values(post.images || {});


    let currentIndex = 0;


    const image =
        document.createElement("img");


    image.className =
        "post-image";


    image.alt =
        post.title || "Portfolio project";


    image.src =
        images[0] || "";


    imageContainer.appendChild(image);


    /* =================
       ARROWS
    ================= */

    if (images.length > 1) {

        const prev =
            document.createElement("button");

        prev.className =
            "image-arrow prev";

        prev.textContent =
            "‹";


        const next =
            document.createElement("button");

        next.className =
            "image-arrow next";

        next.textContent =
            "›";


        imageContainer.appendChild(prev);

        imageContainer.appendChild(next);


        /* DOTS */

        const dots =
            document.createElement("div");

        dots.className =
            "image-dots";


        images.forEach(function(_, index) {

            const dot =
                document.createElement("span");

            dot.className =
                "dot" +
                (index === 0
                    ? " active"
                    : "");

            dots.appendChild(dot);

        });


        imageContainer.appendChild(dots);


        function updateImage() {

            image.src =
                images[currentIndex];


            const allDots =
                dots.querySelectorAll(".dot");


            allDots.forEach(function(dot, index) {

                dot.classList.toggle(
                    "active",
                    index === currentIndex
                );

            });

        }


        prev.onclick = function() {

            currentIndex--;

            if (currentIndex < 0) {

                currentIndex =
                    images.length - 1;

            }

            updateImage();

        };


        next.onclick = function() {

            currentIndex++;

            if (
                currentIndex >=
                images.length
            ) {

                currentIndex = 0;

            }

            updateImage();

        };

    }


    /* =================
       CONTENT
    ================= */

    const content =
        document.createElement("div");


    content.className =
        "post-content";


    const title =
        document.createElement("h2");


    title.className =
        "post-title";


    title.textContent =
        post.title || "Untitled Project";


    const description =
        document.createElement("p");


    description.className =
        "post-description";


    description.textContent =
        post.description || "";


    content.appendChild(title);

    content.appendChild(description);


    /* DATE */

    if (post.createdAt) {

        const date =
            document.createElement("div");


        date.className =
            "post-date";


        date.textContent =
            new Date(
                post.createdAt
            ).toLocaleDateString(
                "en-IN",
                {
                    day: "numeric",
                    month: "short",
                    year: "numeric"
                }
            );


        content.appendChild(date);

    }


    postElement.appendChild(
        imageContainer
    );


    postElement.appendChild(
        content
    );


    container.appendChild(
        postElement
    );

}

</script>

</body>
</html>
