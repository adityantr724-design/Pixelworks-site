<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>PixelWorks - Portfolio</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #080b12;
            color: white;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(8, 11, 18, 0.95);
            border-bottom: 1px solid #202938;
            backdrop-filter: blur(10px);
        }

        .nav {
            max-width: 1200px;
            margin: auto;
            padding: 18px 20px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            color: white;
            text-decoration: none;
            font-size: 22px;
            font-weight: 800;
        }

        .logo span {
            color: #3b82f6;
        }

        .nav-links {
            display: flex;
            gap: 22px;
            align-items: center;
        }

        .nav-links a {
            color: #cbd5e1;
            text-decoration: none;
            font-size: 14px;
        }

        .nav-links a:hover {
            color: #60a5fa;
        }

        .hero {
            max-width: 900px;
            margin: auto;
            padding: 100px 20px 60px;
            text-align: center;
        }

        .hero h1 {
            font-size: clamp(38px, 7vw, 70px);
            margin: 0 0 18px;
        }

        .hero h1 span {
            color: #3b82f6;
        }

        .hero p {
            color: #94a3b8;
            font-size: 17px;
            line-height: 1.7;
            max-width: 650px;
            margin: auto;
        }

        .portfolio-section {
            max-width: 1200px;
            margin: auto;
            padding: 30px 20px 100px;
        }

        .filters {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 40px;
        }

        .filter-btn {
            background: #111827;
            border: 1px solid #293548;
            color: #cbd5e1;
            padding: 10px 16px;
            border-radius: 999px;
            cursor: pointer;
        }

        .filter-btn.active,
        .filter-btn:hover {
            background: #2563eb;
            color: white;
            border-color: #2563eb;
        }

        .projects-grid {
            display: grid;
            grid-template-columns:
                repeat(3, minmax(0, 1fr));

            gap: 25px;
        }

        .project-card {
            background: #101621;
            border: 1px solid #202938;
            border-radius: 15px;
            overflow: hidden;

            transition:
                transform .25s ease,
                border-color .25s ease;
        }

        .project-card:hover {
            transform: translateY(-6px);
            border-color: #3b82f6;
        }

        .project-image {
            width: 100%;
            height: 230px;
            object-fit: cover;
            display: block;
            background: #151b27;
        }

        .project-content {
            padding: 22px;
        }

        .project-category {
            display: inline-block;
            color: #60a5fa;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 9px;
        }

        .project-title {
            margin: 0 0 10px;
            font-size: 21px;
        }

        .project-description {
            color: #94a3b8;
            line-height: 1.6;
            font-size: 14px;
            min-height: 65px;
        }

        .view-btn {
            display: inline-block;
            margin-top: 12px;
            padding: 10px 15px;

            background: #2563eb;
            color: white;

            text-decoration: none;
            border-radius: 8px;

            font-size: 14px;
            font-weight: 700;
        }

        .view-btn:hover {
            background: #1d4ed8;
        }

        .empty {
            text-align: center;
            padding: 60px 20px;
            color: #64748b;
        }

        .loader {
            text-align: center;
            padding: 60px;
            color: #60a5fa;
        }

        @media(max-width: 900px) {

            .projects-grid {
                grid-template-columns: repeat(2, 1fr);
            }

        }

        @media(max-width: 600px) {

            .nav {
                padding: 15px;
            }

            .nav-links {
                gap: 12px;
            }

            .hero {
                padding-top: 70px;
            }

            .projects-grid {
                grid-template-columns: 1fr;
            }

            .project-image {
                height: 210px;
            }

        }

    </style>

</head>


<body>


<!-- ================= NAVBAR ================= -->

<header>

    <div class="nav">

        <a href="index.html" class="logo">
            Pixel<span>Works</span>
        </a>

        <nav class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="services.html">
                Services
            </a>

            <a href="portfolio.html">
                Portfolio
            </a>

            <a href="login.html">
                Login
            </a>

        </nav>

    </div>

</header>


<!-- ================= HERO ================= -->

<section class="hero">

    <h1>
        Our <span>Portfolio</span>
    </h1>

    <p>
        Real projects, creative ideas aur modern digital
        experiences jo humne clients ke liye build kiye hain.
    </p>

</section>


<!-- ================= PORTFOLIO ================= -->

<section class="portfolio-section">


    <!-- FILTERS -->

    <div class="filters">

        <button
            class="filter-btn active"
            data-category="All"
        >
            All
        </button>

        <button
            class="filter-btn"
            data-category="Web Development"
        >
            Web Development
        </button>

        <button
            class="filter-btn"
            data-category="App Development"
        >
            App Development
        </button>

        <button
            class="filter-btn"
            data-category="UI/UX Design"
        >
            UI/UX
        </button>

        <button
            class="filter-btn"
            data-category="AI"
        >
            AI
        </button>

        <button
            class="filter-btn"
            data-category="Cybersecurity"
        >
            Cybersecurity
        </button>

    </div>


    <!-- PROJECTS -->

    <div
        id="projectsGrid"
        class="projects-grid"
    >

        <div class="loader">
            Loading portfolio...
        </div>

    </div>


</section>


<!-- ================= FIREBASE ================= -->

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>


<script>

const firebaseConfig = {

    apiKey: "AIzaSyBPFYE7EUeDJHpTKvBjY6ybHTj-85OYZFY",

    authDomain:
        "pixelworks-agency.firebaseapp.com",

    databaseURL:
        "https://pixelworks-agency-default-rtdb.asia-southeast1.firebasedatabase.app",

    projectId:
        "pixelworks-agency",

    storageBucket:
        "pixelworks-agency.firebasestorage.app",

    messagingSenderId:
        "265457916349",

    appId:
        "1:265457916349:web:1f2f903ed3eaf858c51ad4",

    measurementId:
        "G-21TVP274BD"

};


firebase.initializeApp(firebaseConfig);


const db =
    firebase.database();


const portfolioRef =
    db.ref("portfolio");


let allProjects = [];


/* ================= LOAD ================= */

portfolioRef.on("value", snapshot => {

    allProjects = [];

    if (snapshot.exists()) {

        snapshot.forEach(child => {

            allProjects.push({

                id: child.key,

                ...child.val()

            });

        });

    }

    allProjects.sort((a, b) => {

        return (b.createdAt || 0)
             - (a.createdAt || 0);

    });

    displayProjects("All");

});


/* ================= DISPLAY ================= */

function displayProjects(category) {

    const grid =
        document.getElementById("projectsGrid");

    grid.innerHTML = "";


    let projects =
        allProjects;


    if (category !== "All") {

        projects =
            allProjects.filter(project => {

                return project.category === category;

            });

    }


    if (projects.length === 0) {

        grid.innerHTML = `

            <div
                class="empty"
                style="grid-column:1/-1;"
            >

                <h3>No projects found</h3>

                <p>
                    Is category mein abhi koi project available nahi hai.
                </p>

            </div>

        `;

        return;

    }


    projects.forEach(project => {

        const card =
            document.createElement("article");

        card.className =
            "project-card";


        const image =
            escapeHtml(project.image || "");


        const title =
            escapeHtml(
                project.title || "Untitled Project"
            );


        const categoryText =
            escapeHtml(
                project.category || "Other"
            );


        const description =
            escapeHtml(
                project.description || ""
            );


        card.innerHTML = `

            <img
                class="project-image"
                src="${image}"
                alt="${title}"
                loading="lazy"
                onerror="
                    this.src='data:image/svg+xml;charset=UTF-8,${encodeURIComponent(
                        '<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500"><rect width="100%" height="100%" fill="#151b27"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="#64748b" font-size="24">PixelWorks</text></svg>'
                    )}'
                "
            >

            <div class="project-content">

                <span class="project-category">
                    ${categoryText}
                </span>

                <h2 class="project-title">
                    ${title}
                </h2>

                <p class="project-description">
                    ${description}
                </p>

                ${
                    project.link
                    ?
                    `
                    <a
                        href="${escapeHtml(project.link)}"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="view-btn"
                    >
                        View Project →
                    </a>
                    `
                    :
                    ""
                }

            </div>

        `;


        grid.appendChild(card);

    });

}


/* ================= FILTER ================= */

document
.querySelectorAll(".filter-btn")
.forEach(button => {

    button.addEventListener("click", () => {

        document
        .querySelectorAll(".filter-btn")
        .forEach(btn => {

            btn.classList.remove("active");

        });


        button.classList.add("active");


        displayProjects(
            button.dataset.category
        );

    });

});


/* ================= SECURITY ================= */

function escapeHtml(value) {

    return String(value)

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");

}

</script>


</body>

</html>
