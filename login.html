<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixelWorks - Login</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .auth-section {
            max-width: 450px;
            margin: auto;
            padding-top: 130px;
            padding-bottom: 60px;
        }
        .auth-card {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 14px;
            padding: 30px;
        }
        .auth-input {
            width: 100%;
            padding: 13px;
            margin-top: 7px;
            margin-bottom: 17px;
            background: #090d16;
            border: 1px solid #374151;
            border-radius: 8px;
            color: white;
            outline: none;
            font-size: 14px;
        }
        .auth-input:focus {
            border-color: #3b82f6;
        }
        .auth-label {
            color: #9ca3af;
            font-size: 13px;
        }
        .auth-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
        }
        .btn-primary {
            background: #3b82f6;
            color: white;
        }
        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #6b7280;
            font-size: 12px;
            margin: 20px 0;
        }
        .divider::before,
        .divider::after {
            content: "";
            height: 1px;
            background: #374151;
            flex: 1;
        }
        .forgot {
            display: block;
            text-align: right;
            margin-top: -7px;
            margin-bottom: 18px;
            color: #60a5fa;
            font-size: 13px;
            text-decoration: none;
            cursor: pointer;
        }
        .auth-error {
            color: #ef4444;
            text-align: center;
            font-size: 13px;
            margin-top: 12px;
        }
        .auth-success {
            color: #22c55e;
            text-align: center;
            font-size: 13px;
            margin-top: 12px;
        }
        .bottom-text {
            text-align: center;
            margin-top: 20px;
            color: #9ca3af;
            font-size: 13px;
        }
        .bottom-text a {
            color: #60a5fa;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>

<header>
    <div class="nav-container">
        <a href="index.html" class="logo">PixelWorks</a>
        <div class="hamburger" id="hamburger"><span></span><span></span><span></span></div>
        <ul class="nav-links" id="navLinks">
            <li><a href="index.html">Home</a></li>
            <li><a href="signup.html">Signup</a></li>
        </ul>
    </div>
</header>

<section class="auth-section">
    <div class="auth-card">
        <h2 class="section-title" style="margin-bottom:8px;">Welcome Back</h2>
        <p style="text-align:center; color:#9ca3af; margin-bottom:25px;">Apne PixelWorks account mein login karein.</p>

        <label class="auth-label">Email Address</label>
        <input type="email" id="loginEmail" class="auth-input" placeholder="you@example.com" autocomplete="email">

        <label class="auth-label">Password</label>
        <input type="password" id="loginPassword" class="auth-input" placeholder="Password" autocomplete="current-password">

        <a class="forgot" onclick="forgotPassword()">Forgot Password?</a>

        <button id="loginBtn" class="auth-btn btn-primary">Login</button>

        <p id="authMessage" class="auth-error"></p>
        <div class="bottom-text">Don't have an account? <a href="signup.html">Create Account</a></div>
    </div>
</section>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
<!-- <script src="script.js"></script> -->

<script>
const firebaseConfig = {
    apiKey: "AIzaSyBPFYE7EUeDJHpTKvBjY6ybHTj-85OYZFY",
    authDomain: "pixelworks-agency.firebaseapp.com",
    databaseURL: "https://pixelworks-agency-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "pixelworks-agency",
    storageBucket: "pixelworks-agency.firebasestorage.app",
    messagingSenderId: "265457916349",
    appId: "1:265457916349:web:1f2f903ed3eaf858c51ad4",
    measurementId: "G-21TVP274BD"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

/* EMAIL LOGIN */
document.getElementById("loginBtn").addEventListener("click", loginUser);
document.getElementById("loginPassword").addEventListener("keypress", function(e) {
    if (e.key === "Enter") { loginUser(); }
});

async function loginUser() {
    const email = document.getElementById("loginEmail").value.trim();
    const password = document.getElementById("loginPassword").value;
    const message = document.getElementById("authMessage");

    message.textContent = "";
    if (!email || !password) {
        message.textContent = "Email aur password dono bharo.";
        return;
    }

    try {
        const result = await auth.signInWithEmailAndPassword(email, password);
        const user = result.user;

        const userRef = db.ref("users/" + user.uid);
        const snapshot = await userRef.once("value");
        if (!snapshot.exists()) {
            await userRef.set({
                uid: user.uid,
                name: user.displayName || "",
                email: user.email || "",
                phone: user.phoneNumber || "",
                createdAt: firebase.database.ServerValue.TIMESTAMP
            });
        }

        message.className = "auth-success";
        message.textContent = "Login successful!";
        setTimeout(function() {
            window.location.href = "services.html";
        }, 500);

    } catch(error) {
        console.error(error);
        if (error.code === "auth/invalid-credential") {
            message.textContent = "Email ya password galat hai.";
        } else if (error.code === "auth/user-not-found") {
            message.textContent = "Is email se account nahi mila.";
        } else {
            message.textContent = error.message;
        }
    }
}

/* FORGOT PASSWORD */
async function forgotPassword() {
    const email = document.getElementById("loginEmail").value.trim();
    const message = document.getElementById("authMessage");

    if (!email) {
        message.className = "auth-error";
        message.textContent = "Pehle apna email address enter karo.";
        return;
    }

    try {
        await auth.sendPasswordResetEmail(email);
        message.className = "auth-success";
        message.textContent = "Password reset link tumhare email par bhej diya gaya hai.";
    } catch(error) {
        console.error(error);
        if (error.code === "auth/user-not-found") {
            message.textContent = "Is email se koi account nahi mila.";
        } else {
            message.textContent = error.message;
        }
    }
}
</script>
</body>
</html>
